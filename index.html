<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notionウィジェット</title>
<style>
  :root { --bg: #f7f6f3; --ink: #2b2b2b; --sub: #7d7a73; --card: #fff; --line: #e6e3dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #191919; --ink: #ececea; --sub: #9b9a97; --card: #222; --line: #333; } }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: var(--sub); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  a.item { display: block; padding: 18px 20px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; }
  a.item:hover { border-color: var(--sub); }
  a.item b { display: block; font-size: 16px; margin-bottom: 4px; }
  a.item span { color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Notionウィジェット</h1>
  <p>使いたいウィジェットを開いて、パターンを選んでください。各ページの「URLをコピー」で Notion に埋め込めます。</p>
  <a class="item" href="clock.html"><b>アナログ時計</b><span>4パターン ・ 24時間表示と日付つき ・ 外部との通信なし</span></a>
  <a class="item" href="weather.html"><b>天気と1週間の予報</b><span>3パターン ・ 神戸 ・ 天気データは Open-Meteo（登録不要）</span></a>
</main>
</body>
</html>
