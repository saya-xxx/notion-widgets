<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<title>次の予定への道</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#191919;color:#e9e0ce}body{font:13px system-ui,'Yu Gothic UI',sans-serif;display:flex;align-items:flex-start;padding:5px 2px;overflow:auto;scrollbar-width:none}.timer{width:100%;padding:17px 12px 12px;border:1px solid #726f5e;border-radius:10px;background:#20211c;min-height:185px}h1{font-size:14px;font-weight:500;margin:0 0 8px;letter-spacing:.04em}.hint{font-size:11px;color:#b8b9a5;min-height:16px}.ruler{display:block;width:100%;height:auto;max-height:99px}.ruler text{font-family:Georgia,'Times New Roman',serif;font-size:12px;fill:#e9dfc8}.event{font-size:13px;line-height:1.6;margin-top:3px;overflow-wrap:anywhere}.remaining{font:14px Georgia,'Times New Roman',serif;letter-spacing:.04em;color:#d5dcbf;margin-top:5px}.next{font-size:11px;line-height:1.5;color:#b6b7a7;margin-top:6px}.updated{font-size:9px;color:#7f8476;margin-top:12px;line-height:1.4}.idle{border-color:#484d42}.idle .ruler{opacity:.3}.warning{border-color:#a39464}.warning .remaining{color:#d9b87f}@media(max-width:300px){.timer{padding:13px 9px}.event{font-size:12px}h1{font-size:13px}}
</style>
</head>
<body>
<section class="timer" id="card" aria-label="対象3分類の次の予定まで">
<h1 id="heading">予定を確認しています</h1>
<div class="hint" id="hint"></div>
<svg class="ruler" viewBox="0 0 360 94" role="img" aria-label="右端から左へ減る残り時間のバー">
<rect x="20" y="39" width="320" height="25" rx="1" fill="#35372e" stroke="#e4dac3" stroke-width="1.2"/>
<rect id="fill" x="20" y="40" width="0" height="23" fill="#8e9d78"/>
<g id="ticks" stroke="#e1d7be" stroke-width=".8"></g>
<g id="prepare"><path id="prepare-line" d="" stroke="#cab078" stroke-width="1.4" fill="none"/><path id="prepare-flag" d="" fill="#cab078"/><text id="prepare-label" y="15"></text></g>
<path id="cursor" d="" fill="#eee3ca"/>
<text id="endpoint" x="20" y="87">開始</text>
</svg>
<div class="event" id="event"></div><div class="remaining" id="remaining"></div><div class="next" id="next"></div><div class="updated" id="updated"></div>
</section>
<script>
'use strict';
const TIMER_CATEGORIES={work:'仕事・勉強',out:'人と会う・出かける・受取り',customer:'お客様・関係者'};
const TIMER_DAY_MS=86400000;
function timerDayKey(ms){return new Date(ms+9*3600000).toISOString().slice(0,10);}
function timerClock(ms){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms));}
function timerWhen(ms,now){const day=timerDayKey(ms);return(day===timerDayKey(now)?'':day.slice(5).replace('-','/')+' ')+timerClock(ms);}
function timerDuration(ms){const m=Math.max(0,Math.ceil(ms/60000));return m>=60?Math.floor(m/60)+'時間'+(m%60?m%60+'分':''):m+'分';}
function timerState(payload,now){
 const empty={mode:'idle',title:'予定を確認できません',hint:'毎朝の更新、または予定の読み直しを確認してください',event:'',remaining:'',next:'',fill:0,prepFraction:null,markerLabel:'',endpoint:'開始'};
 if(!payload||payload.v!==1||payload.ok!==true||!Number.isFinite(payload.updatedAt)||!Array.isArray(payload.events))return empty;
 if(now-payload.updatedAt>36*3600000)return {...empty,title:'予定の更新を確認してください',hint:'前回取得から時間がたっています'};
 const today=timerDayKey(now);
 const events=payload.events.filter(e=>e&&Object.hasOwn(TIMER_CATEGORIES,e.category)&&typeof e.title==='string'&&Number.isFinite(e.start)&&Number.isFinite(e.end)&&e.end>e.start).sort((a,b)=>a.start-b.start||a.end-b.end);
 const allDay=Array.isArray(payload.allDay)?payload.allDay.filter(e=>e&&Object.hasOwn(TIMER_CATEGORIES,e.category)&&typeof e.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)):[];
 const active=events.filter(e=>e.start<=now&&now<e.end).sort((a,b)=>a.end-b.end)[0];
 const future=events.find(e=>e.start>now);
 if(active){
  const names={work:'仕事・勉強の時間',out:'外出・受取りの予定中',customer:'打ち合わせの予定中'};
  return {mode:'active',title:names[active.category],hint:'終了まで、バーが左へ減ります',event:timerClock(active.start)+'–'+timerClock(active.end)+' '+active.title,remaining:'終了まで '+timerDuration(active.end-now),next:future?'次：'+timerWhen(future.start,now)+' '+future.title:'',fill:Math.max(0,Math.min(1,(active.end-now)/(active.end-active.start))),prepFraction:null,markerLabel:'',endpoint:'終了'};
 }
 const target=future&&timerDayKey(future.start)===today?future:null;
 if(target){
  const previous=events.filter(e=>e.end<=target.start&&timerDayKey(e.end)===today).reduce((a,e)=>Math.max(a,e.end),0);
  const anchor=Math.min(target.start-60000,Math.max(payload.updatedAt,previous));
  const span=target.start-anchor;
  const hasDeparture=Number.isFinite(target.prepareAt)&&target.prepareAt<target.start;
  const prepAt=hasDeparture?target.prepareAt:target.start-15*60000;
  const warning=now>=prepAt;
  const remaining=target.start-now;
  return {mode:warning?'warning':'upcoming',title:'次の予定まで',hint:warning?(hasDeparture?'出発の目安の時刻です':'そろそろ準備の時間です'):(hasDeparture?'出発の目安 '+timerClock(prepAt):'準備の目安は15分前'),event:timerClock(target.start)+' '+target.title,remaining:'残り '+timerDuration(remaining),next:TIMER_CATEGORIES[target.category],fill:Math.max(0,Math.min(1,remaining/span)),prepFraction:Math.max(0,Math.min(1,(target.start-prepAt)/span)),markerLabel:hasDeparture?'出発':'準備',endpoint:'開始'};
 }
 const todaysAllDay=allDay.filter(e=>e.date<=today&&(e.endDate||e.date)>=today);
 const hadToday=events.some(e=>timerDayKey(e.start)===today&&e.end<=now);
 if(todaysAllDay.length)return {...empty,title:'今日は終日の予定があります',hint:'開始時刻のない予定はカウントダウンしません',event:'終日 '+todaysAllDay[0].title,next:future?'次：'+timerWhen(future.start,now)+' '+future.title:'次の時刻指定の予定はありません'};
 return {...empty,title:hadToday?'今日の予定はおしまい':'今日は時間を自由に使えます',hint:'対象3分類の時刻指定の予定はありません',next:future?'次：'+timerWhen(future.start,now)+' '+future.title:'次の対象予定は登録されていません'};
}
if(typeof document!=='undefined'){
 const $=id=>document.getElementById(id),svgNS='http://www.w3.org/2000/svg';
 for(let i=0;i<=40;i++){const line=document.createElementNS(svgNS,'line');const x=20+i*8;line.setAttribute('x1',x);line.setAttribute('x2',x);line.setAttribute('y1',i%5===0?49:56);line.setAttribute('y2',63);$('ticks').appendChild(line);}
 let payload=null;
 function read(){try{payload=JSON.parse(new URLSearchParams(location.hash.slice(1)).get('data'));}catch{payload=null;}}
 function render(){
  const now=Date.now(),s=timerState(payload,now);$('card').className='timer '+(s.mode==='idle'?'idle':s.mode==='warning'?'warning':'');
  for(const [id,value]of Object.entries({heading:s.title,hint:s.hint,event:s.event,remaining:s.remaining,next:s.next,endpoint:s.endpoint}))$(id).textContent=value;
  const x=20+320*s.fill;$('fill').setAttribute('width',320*s.fill);$('fill').setAttribute('fill',s.mode==='warning'?'#b19a6a':'#8e9d78');
  $('cursor').setAttribute('d',s.fill>0?`M ${x-5} 28 L ${x+5} 28 L ${x} 38 Z`:'');
  $('prepare').style.display=s.prepFraction===null?'none':'';
  if(s.prepFraction!==null){const px=20+320*s.prepFraction;$('prepare-line').setAttribute('d',`M ${px} 20 V 66`);$('prepare-flag').setAttribute('d',`M ${px} 20 L ${px+16} 25 L ${px} 30 Z`);$('prepare-label').setAttribute('x',Math.max(42,Math.min(300,px)));$('prepare-label').textContent=s.markerLabel;}
  $('updated').textContent=payload&&Number.isFinite(payload.updatedAt)?'予定の取得：'+timerDayKey(payload.updatedAt).slice(5).replace('-','/')+' '+timerClock(payload.updatedAt):'';
 }
 read();render();setInterval(render,1000);addEventListener('hashchange',()=>{read();render();});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
}
</script>
</body>
</html>
